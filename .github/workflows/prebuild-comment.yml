name: "[Prebuild] PR Artifact Comment"
description: "Create or update the per-commit prebuild artifact PR comment"

on:
  repository_dispatch:
    types: [prebuild-published]

concurrency:
  group: prebuild-comment-${{ github.event.client_payload.pr_number }}
  cancel-in-progress: false

permissions:
  actions: read
  issues: write
  packages: read
  pull-requests: write

jobs:
  upsert-comment:
    runs-on: ubuntu-latest
    steps:
      - name: Upsert prebuild artifact comment
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const payload = context.payload.client_payload || {};
            const prNumber = Number(payload.pr_number);
            const headSha = String(payload.head_sha || "");
            const headRef = String(payload.head_ref || "");
            const shortSha = headSha.slice(0, 7);

            if (!prNumber || !headSha) {
              core.setFailed("prebuild-published payload must include pr_number and head_sha");
              return;
            }

            const marker = `<!-- prebuild-artifacts pr=${prNumber} sha=${headSha} -->`;
            const markerPrefix = `<!-- prebuild-artifacts pr=${prNumber} sha=`;
            const repo = `${context.repo.owner}/${context.repo.repo}`;
            const cleanBranch = headRef
              .replace(/^prebuild\//, "")
              .replace(/\//g, "-")
              .replace(/_/g, "-")
              .toLowerCase();
            const chartSuffix = String(payload.chart_suffix || payload.chartSuffix || (cleanBranch && shortSha ? `${cleanBranch}-${shortSha}` : ""));
            const packageOwnerType = String(context.payload.repository?.owner?.type || "").toLowerCase();
            const chartDefinitions = new Map([
              ["ai-platform-engineering", {
                name: "ai-platform-engineering",
                packageName: "prebuild-helm-charts/ai-platform-engineering",
                releaseName: "ai-platform",
              }],
              ["rag-stack", {
                name: "rag-stack",
                packageName: "prebuild-helm-charts/rag-stack",
                releaseName: "rag",
              }],
            ]);

            const normalizeStatus = (value) => {
              const status = String(value || "published").toLowerCase();
              if (["building", "in_progress", "pending", "queued"].includes(status)) {
                return "building";
              }
              if (["failed", "failure", "cancelled", "canceled"].includes(status)) {
                return "failed";
              }
              return "published";
            };

            const statusLabel = (status) => {
              if (status === "building") return "Build in process";
              if (status === "failed") return "Failed";
              return "Published";
            };

            const markdownCell = (value) => String(value || "").replaceAll("|", "\\|");
            const codeCell = (value) => value ? `\`${markdownCell(value)}\`` : "-";
            const ciCell = (runUrl) => runUrl ? `[CI](${runUrl})` : "-";
            const present = (value) => String(value || "") !== "";
            const keyFor = (artifact) => `${artifact.type}\0${artifact.name.toLowerCase()}`;
            const failedRunConclusions = new Set(["action_required", "cancelled", "failure", "timed_out"]);

            const runUrlFromId = (runId) => runId ? `https://github.com/${repo}/actions/runs/${runId}` : "";
            const runIdFromUrl = (runUrl) => String(runUrl || "").match(/\/actions\/runs\/(\d+)/)?.[1] || "";

            const normalizeArtifact = (artifact) => {
              const runId = String(artifact.run_id || artifact.runId || payload.run_id || payload.runId || "");
              const runUrl = String(artifact.run_url || artifact.runUrl || payload.run_url || payload.runUrl || runUrlFromId(runId) || "");
              const type = artifact.type === "helm-chart" ? "helm-chart" : "image";
              const repository = String(artifact.repository || artifact.image_repo || "");
              const tag = String(artifact.tag || artifact.prebuild_tag || "");
              const version = String(artifact.version || "");
              const ref = String(artifact.ref || artifact.image_ref || (type === "image" && repository && tag ? `${repository}:${tag}` : ""));

              return {
                type,
                name: String(artifact.name || artifact.component || artifact.agent || ""),
                repository,
                tag,
                version,
                ref,
                releaseName: String(artifact.releaseName || artifact.release_name || ""),
                status: normalizeStatus(artifact.status),
                workflow: String(artifact.workflow || payload.workflow || ""),
                runId,
                runUrl,
              };
            };

            const payloadArtifacts = (payload.artifacts || [])
              .map(normalizeArtifact)
              .filter((artifact) => artifact.name);

            const splitMarkdownRow = (line) => {
              const cells = [];
              let current = "";
              let escaped = false;

              for (const char of line) {
                if (escaped) {
                  current += char;
                  escaped = false;
                  continue;
                }
                if (char === "\\") {
                  escaped = true;
                  continue;
                }
                if (char === "|") {
                  cells.push(current.trim());
                  current = "";
                  continue;
                }
                current += char;
              }
              cells.push(current.trim());
              return cells.slice(1, -1);
            };

            const cleanCell = (value) => {
              let cell = String(value || "").trim();
              if (cell === "-") return "";
              if (cell.startsWith("`") && cell.endsWith("`")) {
                cell = cell.slice(1, -1);
              }
              return cell;
            };

            const runUrlFromCell = (value) => {
              const match = String(value || "").match(/^\[CI\]\((.+)\)$/);
              return match ? match[1] : "";
            };

            const statusFromCell = (value) => {
              if (value === "Build in process") return "building";
              if (value === "Failed") return "failed";
              return "published";
            };

            const parseExistingArtifacts = (body) => {
              const artifacts = [];
              let section = "";
              let headers = [];

              for (const line of body.split("\n")) {
                if (line.startsWith("### Docker Images")) {
                  section = "image";
                  headers = [];
                  continue;
                }
                if (line.startsWith("### Helm Charts")) {
                  section = "helm-chart";
                  headers = [];
                  continue;
                }
                if (line.startsWith("### ")) {
                  section = "";
                  headers = [];
                  continue;
                }
                if (!section || !line.startsWith("|")) {
                  continue;
                }
                if (/^\|[ -]*---/.test(line)) {
                  continue;
                }

                const cells = splitMarkdownRow(line);
                if (!headers.length) {
                  headers = cells;
                  continue;
                }

                const column = (name) => {
                  const index = headers.indexOf(name);
                  return index === -1 ? "" : cells[index] || "";
                };

                if (section === "image") {
                  const repository = cleanCell(column("Image"));
                  const tag = cleanCell(column("Tag"));
                  artifacts.push({
                    type: "image",
                    name: cleanCell(column("Artifact")),
                    repository,
                    tag,
                    version: "",
                    ref: repository && tag ? `${repository}:${tag}` : "",
                    releaseName: "",
                    status: statusFromCell(column("Status")),
                    workflow: "",
                    runId: "",
                    runUrl: runUrlFromCell(column("CI")),
                  });
                } else {
                  artifacts.push({
                    type: "helm-chart",
                    name: cleanCell(column("Chart")),
                    repository: cleanCell(column("Registry")),
                    tag: "",
                    version: cleanCell(column("Version")),
                    ref: "",
                    releaseName: "",
                    status: statusFromCell(column("Status")),
                    workflow: "",
                    runId: "",
                    runUrl: runUrlFromCell(column("CI")),
                  });
                }
              }

              return artifacts.filter((artifact) => artifact.name);
            };

            const listPackageVersions = async (packageName) => {
              const request = {
                package_type: "container",
                package_name: packageName,
                per_page: 100,
              };
              const userRequest = {
                fn: github.rest.packages.getAllPackageVersionsForPackageOwnedByUser,
                params: { username: context.repo.owner },
              };
              const orgRequest = {
                fn: github.rest.packages.getAllPackageVersionsForPackageOwnedByOrg,
                params: { org: context.repo.owner },
              };
              const requests = packageOwnerType === "user"
                ? [userRequest, orgRequest]
                : [orgRequest, userRequest];

              for (const candidate of requests) {
                try {
                  return await github.paginate(candidate.fn, {
                    ...request,
                    ...candidate.params,
                  });
                } catch (error) {
                  if (error.status === 404) {
                    continue;
                  }
                  core.warning(`Could not list GHCR package ${packageName}: ${error.message}`);
                  return [];
                }
              }

              return [];
            };

            const discoverPublishedCharts = async (artifacts) => {
              if (!chartSuffix) {
                return [];
              }

              const chartNames = [...new Set(
                artifacts
                  .filter((artifact) => artifact.type === "helm-chart")
                  .map((artifact) => artifact.name.toLowerCase())
              )];
              const discovered = [];

              for (const chartName of chartNames) {
                const definition = chartDefinitions.get(chartName);
                if (!definition) {
                  continue;
                }

                const versions = await listPackageVersions(definition.packageName);
                const matchingVersion = [...new Set(
                  versions.flatMap((version) => version.metadata?.container?.tags || [])
                )]
                  .filter((tag) => tag.endsWith(`-${chartSuffix}`))
                  .sort()
                  .at(-1);

                if (!matchingVersion) {
                  continue;
                }

                core.info(`Discovered published Helm chart ${definition.name}:${matchingVersion} in GHCR`);
                discovered.push({
                  type: "helm-chart",
                  name: definition.name,
                  repository: `ghcr.io/${context.repo.owner}/prebuild-helm-charts/${definition.name}`,
                  tag: "",
                  version: matchingVersion,
                  ref: "",
                  releaseName: definition.releaseName,
                  status: "published",
                  workflow: "",
                  runId: "",
                  runUrl: "",
                });
              }

              return discovered;
            };

            const resolveCompletedBuildStatuses = async (artifacts) => {
              const runCache = new Map();
              const resolved = [];

              for (const artifact of artifacts) {
                if (artifact.status !== "building") {
                  resolved.push(artifact);
                  continue;
                }

                const runId = artifact.runId || runIdFromUrl(artifact.runUrl);
                if (!runId) {
                  resolved.push(artifact);
                  continue;
                }

                if (!runCache.has(runId)) {
                  try {
                    const { data: run } = await github.rest.actions.getWorkflowRun({
                      owner: context.repo.owner,
                      repo: context.repo.repo,
                      run_id: runId,
                    });
                    runCache.set(runId, {
                      status: String(run.status || ""),
                      conclusion: String(run.conclusion || ""),
                    });
                  } catch (error) {
                    core.warning(`Could not read workflow run ${runId}: ${error.message}`);
                    runCache.set(runId, null);
                  }
                }

                const run = runCache.get(runId);
                if (run?.status === "completed" && failedRunConclusions.has(run.conclusion)) {
                  core.info(`Marking ${artifact.name} failed from completed workflow run ${runId} (${run.conclusion})`);
                  resolved.push({
                    ...artifact,
                    status: "failed",
                    runId,
                    runUrl: artifact.runUrl || runUrlFromId(runId),
                  });
                } else {
                  resolved.push({
                    ...artifact,
                    runId,
                    runUrl: artifact.runUrl || runUrlFromId(runId),
                  });
                }
              }

              return resolved;
            };

            const sameRun = (oldArtifact, newArtifact) => {
              return (present(oldArtifact.runId) && present(newArtifact.runId) && oldArtifact.runId === newArtifact.runId)
                || (present(oldArtifact.runUrl) && present(newArtifact.runUrl) && oldArtifact.runUrl === newArtifact.runUrl);
            };

            const mergeArtifact = (oldArtifact = {}, newArtifact) => {
              if (newArtifact.status === "building") {
                if (oldArtifact.status === "published" && sameRun(oldArtifact, newArtifact)) {
                  return oldArtifact;
                }
                return {
                  ...newArtifact,
                  repository: "",
                  tag: "",
                  version: "",
                  ref: "",
                };
              }

              return {
                ...newArtifact,
                repository: newArtifact.repository || oldArtifact.repository || "",
                tag: newArtifact.tag || oldArtifact.tag || "",
                version: newArtifact.version || oldArtifact.version || "",
                ref: newArtifact.ref || oldArtifact.ref || "",
                releaseName: newArtifact.releaseName || oldArtifact.releaseName || "",
                workflow: newArtifact.workflow || oldArtifact.workflow || "",
                runId: newArtifact.runId || oldArtifact.runId || "",
                runUrl: newArtifact.runUrl || oldArtifact.runUrl || "",
              };
            };

            const releaseNameFor = (artifact) => {
              if (artifact.releaseName) return artifact.releaseName;
              if (artifact.name === "rag-stack") return "rag";
              if (artifact.name === "ai-platform-engineering") return "ai-platform";
              return artifact.name;
            };

            const renderCompactTable = (artifacts, label) => [
              `| ${label} | Status | CI |`,
              "| --- | --- | --- |",
              ...artifacts.map((artifact) =>
                `| ${markdownCell(artifact.name)} | ${statusLabel(artifact.status)} | ${ciCell(artifact.runUrl)} |`
              ),
            ].join("\n");

            const renderImageTable = (artifacts) => [
              "| Artifact | Image | Tag | Status | CI |",
              "| --- | --- | --- | --- | --- |",
              ...artifacts.map((artifact) =>
                `| ${markdownCell(artifact.name)} | ${codeCell(artifact.repository)} | ${codeCell(artifact.tag)} | ${statusLabel(artifact.status)} | ${ciCell(artifact.runUrl)} |`
              ),
            ].join("\n");

            const renderChartTable = (artifacts) => [
              "| Chart | Registry | Version | Status | CI |",
              "| --- | --- | --- | --- | --- |",
              ...artifacts.map((artifact) =>
                `| ${markdownCell(artifact.name)} | ${codeCell(artifact.repository)} | ${codeCell(artifact.version)} | ${statusLabel(artifact.status)} | ${ciCell(artifact.runUrl)} |`
              ),
            ].join("\n");

            const renderComment = (artifacts, collapsed = false) => {
              const imageArtifacts = artifacts.filter((artifact) => artifact.type === "image");
              const chartArtifacts = artifacts.filter((artifact) => artifact.type === "helm-chart");
              const lines = [
                marker,
                `## Prebuild Artifacts for \`${shortSha}\``,
                "",
                `**Branch:** \`${headRef}\``,
                `**Commit:** \`${shortSha}\``,
                "",
              ];

              if (imageArtifacts.length) {
                lines.push("### Docker Images", "");
                if (imageArtifacts.some((artifact) => artifact.status === "published")) {
                  lines.push(renderImageTable(imageArtifacts), "");
                } else {
                  lines.push(renderCompactTable(imageArtifacts, "Artifact"), "");
                }

                const pullable = imageArtifacts.filter((artifact) => artifact.status === "published" && artifact.ref);
                if (pullable.length) {
                  lines.push(
                    "<details>",
                    "<summary>Docker pull commands</summary>",
                    "",
                    "```bash",
                    ...pullable.map((artifact) => `docker pull ${artifact.ref}`),
                    "```",
                    "",
                    "</details>",
                    "",
                  );
                }
              }

              if (chartArtifacts.length) {
                lines.push("### Helm Charts", "");
                if (chartArtifacts.some((artifact) => artifact.status === "published")) {
                  lines.push(renderChartTable(chartArtifacts), "");
                } else {
                  lines.push(renderCompactTable(chartArtifacts, "Chart"), "");
                }

                const installable = chartArtifacts.filter((artifact) => artifact.status === "published" && artifact.repository && artifact.version);
                if (installable.length) {
                  lines.push(
                    "<details>",
                    "<summary>Helm install commands</summary>",
                    "",
                    "```bash",
                    ...installable.map((artifact) => `helm upgrade --install ${releaseNameFor(artifact)} oci://${artifact.repository} --version ${artifact.version}`),
                    "```",
                    "",
                    "</details>",
                    "",
                  );
                }
              }

              if (!imageArtifacts.length && !chartArtifacts.length) {
                lines.push("No prebuild artifacts have been reported yet.", "");
              }

              lines.push("> These prebuild artifacts will be automatically cleaned up when the PR is closed or merged.");
              const body = lines.join("\n");

              if (!collapsed) {
                return body;
              }

              return [
                marker,
                "<details>",
                `<summary>Prebuild Artifacts for \`${shortSha}\` (archived)</summary>`,
                "",
                body.replace(marker, "").trim(),
                "",
                "</details>",
              ].join("\n");
            };

            const [{ data: pull }] = await Promise.all([
              github.rest.pulls.get({
                owner: context.repo.owner,
                repo: context.repo.repo,
                pull_number: prNumber,
              }),
            ]);
            const isCurrentHead = pull.head.sha === headSha;

            const comments = await github.paginate(github.rest.issues.listComments, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: prNumber,
              per_page: 100,
            });

            const existingComment = comments.find((comment) =>
              comment.user?.type === "Bot" && (comment.body || "").includes(marker)
            );

            const artifactsByKey = new Map();
            for (const artifact of parseExistingArtifacts(existingComment?.body || "")) {
              artifactsByKey.set(keyFor(artifact), artifact);
            }
            for (const artifact of payloadArtifacts) {
              const key = keyFor(artifact);
              artifactsByKey.set(key, mergeArtifact(artifactsByKey.get(key), artifact));
            }
            for (const artifact of await discoverPublishedCharts([...artifactsByKey.values()])) {
              const key = keyFor(artifact);
              artifactsByKey.set(key, mergeArtifact(artifactsByKey.get(key), artifact));
            }
            for (const artifact of await resolveCompletedBuildStatuses([...artifactsByKey.values()])) {
              const key = keyFor(artifact);
              artifactsByKey.set(key, artifact);
            }

            const artifacts = [...artifactsByKey.values()]
              .filter((artifact) =>
                artifact.status === "building"
                || artifact.status === "failed"
                || (artifact.type === "image" && (artifact.tag || artifact.ref))
                || (artifact.type === "helm-chart" && artifact.version)
              )
              .sort((a, b) => Number(a.type === "helm-chart") - Number(b.type === "helm-chart") || a.name.localeCompare(b.name));

            const body = renderComment(artifacts, !isCurrentHead);

            if (existingComment) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existingComment.id,
                body,
              });
              core.info(`Updated prebuild artifact comment ${existingComment.id}`);
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: prNumber,
                body,
              });
              core.info("Created prebuild artifact comment");
            }

            if (!isCurrentHead) {
              return;
            }

            const olderComments = comments.filter((comment) =>
              comment.user?.type === "Bot"
              && (comment.body || "").includes(markerPrefix)
              && !(comment.body || "").includes(marker)
            );

            for (const comment of olderComments) {
              const oldMarker = (comment.body || "").match(/<!-- prebuild-artifacts pr=\d+ sha=([^ ]+) -->/);
              const oldShortSha = oldMarker?.[1]?.slice(0, 7) || "previous";

              if ((comment.body || "").includes("(archived)</summary>")) {
                continue;
              }

              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: comment.id,
                body: [
                  oldMarker?.[0] || "",
                  "<details>",
                  `<summary>Prebuild Artifacts for \`${oldShortSha}\` (archived)</summary>`,
                  "",
                  (comment.body || "").replace(oldMarker?.[0] || "", "").trim(),
                  "",
                  "</details>",
                ].filter(Boolean).join("\n"),
              });
              core.info(`Archived older prebuild artifact comment ${comment.id}`);
            }
