name: "[Prebuild] Dynamic Agents Docker Build and Push"
description: "Build and push Dynamic Agents Docker image for prebuild branches"

on:
  pull_request:
    types: [opened, synchronize, reopened, closed]
    paths:
      - 'ai_platform_engineering/dynamic_agents/**'

env:
  IMAGE_NAME: ${{ github.repository_owner }}/prebuild/caipe-dynamic-agents

permissions:
  contents: write
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    if: |
      github.event_name == 'pull_request' &&
      startsWith(github.head_ref, 'prebuild/') &&
      github.event.action != 'closed'
    permissions:
      contents: write  # Required for repository_dispatch
      packages: write
      pull-requests: write

    steps:
      - name: 🔒 Harden runner
        uses: step-security/harden-runner@8d3c67de8e2fe68ef647c8db1e6a09f647780f40  # v2.19.0
        with:
          egress-policy: audit

      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          fetch-depth: 0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@4d04d5d9486b7bd6fa91e7baf45bbb4f8b9deedd # v4
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@4907a6ddec9925e35a0a9e82d7399ccc52663121 # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute prebuild tag
        id: compute_tag
        shell: bash
        run: |
          BRANCH="${{ github.head_ref || github.ref_name }}"
          BRANCH_NO_PREFIX="${BRANCH#prebuild/}"
          BRANCH_SANITIZED="${BRANCH_NO_PREFIX//\//-}"
          SHORT_SHA="${{ github.event.pull_request.head.sha }}"
          SHORT_SHA="${SHORT_SHA:0:7}"
          echo "BRANCH_BARE=${BRANCH_SANITIZED}" >> $GITHUB_ENV
          echo "SHORT_SHA=${SHORT_SHA}" >> $GITHUB_ENV
          echo "PREBUILD_TAG=${BRANCH_SANITIZED}-${SHORT_SHA}" >> $GITHUB_ENV

      - name: Extract metadata for Docker
        id: meta
        uses: docker/metadata-action@030e881283bb7a6894de51c315a6bfe6a94e05cf # v6
        with:
          images: ghcr.io/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=${{ env.PREBUILD_TAG }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@ce360397dd3f832beb865e1373c09c0e9f86d70a # v4
      - name: Build and Push Dynamic Agents Docker image
        id: build_push
        uses: docker/build-push-action@bcafcacb16a39f128d818304e6c9c0c18556b85f # v7
        with:
          context: ai_platform_engineering/dynamic_agents
          file: ai_platform_engineering/dynamic_agents/build/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          platforms: linux/amd64,linux/arm64
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: false
          sbom: false

      - name: Write prebuild artifact metadata
        if: ${{ always() && github.event_name == 'pull_request' && steps.compute_tag.outcome == 'success' }}
        shell: bash
        env:
          IMAGE_REPO: ghcr.io/${{ env.IMAGE_NAME }}
        run: |
          mkdir -p prebuild-artifacts
          STATUS="published"
          if [[ "${{ steps.build_push.outcome }}" != "success" ]]; then
            STATUS="failed"
          fi
          IMAGE_REF="${IMAGE_REPO}:${PREBUILD_TAG}"
          RUN_URL="https://github.com/${{ github.repository }}/actions/runs/${GITHUB_RUN_ID}"
          jq -n \
            --arg type "image" \
            --arg name "Dynamic Agents" \
            --arg image_repo "$IMAGE_REPO" \
            --arg tag "$PREBUILD_TAG" \
            --arg image_ref "$IMAGE_REF" \
            --arg status "$STATUS" \
            --arg workflow "$GITHUB_WORKFLOW" \
            --arg run_id "$GITHUB_RUN_ID" \
            --arg run_url "$RUN_URL" \
            '{type: $type, name: $name, repository: $image_repo, tag: $tag, ref: $image_ref, status: $status, workflow: $workflow, run_id: $run_id, run_url: $run_url}' \
            > prebuild-artifacts/dynamic-agents.json

      - name: Upload prebuild artifact metadata
        if: ${{ always() && github.event_name == 'pull_request' && steps.compute_tag.outcome == 'success' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: prebuild-artifact-dynamic-agents
          path: prebuild-artifacts/dynamic-agents.json
          retention-days: 1

  notify-prebuild-comment:
    runs-on: ubuntu-latest
    needs: build-and-push
    if: |
      always() &&
      github.event_name == 'pull_request' &&
      startsWith(github.head_ref, 'prebuild/') &&
      github.event.action != 'closed' &&
      (needs.build-and-push.result == 'success' || needs.build-and-push.result == 'failure')
    permissions:
      actions: read
      contents: write  # Required for repository_dispatch
    steps:
      - name: Download prebuild artifact metadata
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: prebuild-artifact-dynamic-agents
          path: prebuild-artifacts

      - name: Notify prebuild artifact comment
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          jq -s '.' prebuild-artifacts/*.json > prebuild-artifacts.json
          PREBUILD_TAG=$(jq -r 'map(select(.tag != "")) | .[0].tag // ""' prebuild-artifacts.json)
          jq -n \
            --slurpfile artifacts prebuild-artifacts.json \
            --argjson pr_number "${{ github.event.pull_request.number }}" \
            --arg head_sha "${{ github.event.pull_request.head.sha }}" \
            --arg head_ref "${{ github.event.pull_request.head.ref }}" \
            --arg prebuild_tag "$PREBUILD_TAG" \
            --arg workflow "$GITHUB_WORKFLOW" \
            --arg run_id "$GITHUB_RUN_ID" \
            '{
              event_type: "prebuild-published",
              client_payload: {
                pr_number: $pr_number,
                head_sha: $head_sha,
                head_ref: $head_ref,
                prebuild_tag: $prebuild_tag,
                workflow: $workflow,
                run_id: $run_id,
                artifacts: $artifacts[0]
              }
            }' > prebuild-published.json

          gh api --method POST /repos/${{ github.repository }}/dispatches --input prebuild-published.json

  cleanup-images:
    runs-on: ubuntu-latest
    if: github.event.action == 'closed' && startsWith(github.event.pull_request.head.ref, 'prebuild/')
    permissions:
      contents: read
      packages: write
    env:
      OWNER: ${{ github.repository_owner }}
      PACKAGE_NAME: prebuild/caipe-dynamic-agents
    steps:
      - name: Delete prebuild images for branch
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
        with:
          script: |
            const owner = process.env.OWNER;
            const rawBranch = process.env.HEAD_REF || '';
            const branchNoPrefix = rawBranch.startsWith('prebuild/') ? rawBranch.substring('prebuild/'.length) : rawBranch;
            const sanitized = branchNoPrefix.replace(/\//g, '-');
            const prefix = `${sanitized}-`;
            const packageName = process.env.PACKAGE_NAME;
            const packageType = 'container';
            try {
              const versions = await github.paginate(github.rest.packages.getAllPackageVersionsForPackageOwnedByOrg, {
                org: owner,
                package_type: packageType,
                package_name: packageName,
                per_page: 100,
              });
              const toDelete = versions.filter(v => (v.metadata?.container?.tags || []).some(t => t.startsWith(prefix)));
              for (const v of toDelete) {
                await github.rest.packages.deletePackageVersionForOrg({
                  org: owner,
                  package_type: packageType,
                  package_name: packageName,
                  package_version_id: v.id,
                });
              }
              core.info(`Deleted ${toDelete.length} versions for ${packageName} with tag prefix ${prefix}`);
            } catch (e) {
              if (e.status === 404) {
                core.info(`Package ${packageName} not found in org ${owner}, skipping.`);
              } else {
                throw e;
              }
            }
